name: Obj3D
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Obj3D:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Obj3D
      - path: ../kaggle/runner.py
        buildPhase: resources
    info:
      path: Obj3D/Info.plist
      properties:
        CFBundleDisplayName: 3D 掃描
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        OBJ3DCommit: "$(OBJ3D_COMMIT)"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 需要使用相機錄製物體，並追蹤手機位置來換算真實尺寸。
        NSPhotoLibraryAddUsageDescription: 錄影時把影片另存到「照片」App。
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.obj3d
        CURRENT_PROJECT_VERSION: "1"
        OBJ3D_COMMIT: "local"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
